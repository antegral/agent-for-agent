name: Publish AMS image (compile only)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable tag
        id: tag
        shell: bash
        run: echo "value=ghcr.io/antegral/ams-mcp:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and publish both architectures
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tag.outputs.value }}
          provenance: mode=max
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/antegral/agent-for-agent
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record release evidence
        env:
          IMAGE: ${{ steps.tag.outputs.value }}
          DIGEST: ${{ steps.image.outputs.digest }}
          METADATA: ${{ steps.image.outputs.metadata }}
        shell: bash
        run: |
          printf '%s\n' "$IMAGE@$DIGEST" | tee image-reference.txt
          printf '%s\n' "$METADATA" > image-metadata.json
          printf 'Image: `%s@%s`\nSource: `%s`\nPlatforms: linux/amd64, linux/arm64\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ams-image-release
          path: |
            image-reference.txt
            image-metadata.json
